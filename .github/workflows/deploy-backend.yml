name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # 1. 编译 (依然在 GitHub 上做)
      - name: Build Binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o main .
          # 打包以加速传输
          tar -czvf release.tar.gz main configs Dockerfile docker-compose.yml

      # 2. 配置 SSH (使用原生 ssh key)
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary # 忽略 host key 检查
          if_key_exists: replace

      # 3. 使用原生 SCP 和 SSH 上传并部署 (增加重试机制)
      - name: Deploy with Retry
        run: |
          # 添加服务器到 known_hosts 以防询问
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

          echo "1. Uploading file (attempt 1)..."
          # 使用原生 scp，-o ServerAliveInterval 保持连接活跃
          if ! scp -o ConnectTimeout=30 release.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/blue-lock-project/release.tar.gz; then
             echo "Upload failed, retrying in 10s..."
             sleep 10
             scp -o ConnectTimeout=60 release.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/blue-lock-project/release.tar.gz
          fi

          echo "2. Executing remote commands..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd ~/blue-lock-project
            
            # 解压
            mkdir -p backend
            tar -xzvf release.tar.gz -C backend/
            rm release.tar.gz
            
            # 重启
            cd backend
            docker compose down
            docker compose up -d --force-recreate
            docker image prune -f
          EOF
