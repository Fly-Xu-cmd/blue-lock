name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # 1. 编译 + 压缩 (关键步骤)
      - name: Build and Compress
        run: |
          cd backend

          echo "1. Building Binary..."
          # -ldflags="-s -w" 去掉符号表，大幅减小体积
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o main .

          echo "2. Compressing files..."
          # 将所有需要的文件打包成一个 release.tar.gz
          # 包含: 二进制文件, 配置文件, Dockerfile, docker-compose.yml
          tar -czvf release.tar.gz main configs Dockerfile docker-compose.yml

          echo "File size:"
          ls -lh release.tar.gz

      # 2. 只上传这一个压缩包
      - name: Copy compressed file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/release.tar.gz"
          target: "blue-lock-project" # 上传到服务器的这个目录
          strip_components: 1 # 去掉本地的 'backend/' 前缀，直接把文件放到 target 目录
          timeout: "600s" # 设置 10 分钟超时，防止断开
          debug: true # 开启调试模式，看看到底卡在哪

      # 3. 远程解压并重启
      - name: Remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/blue-lock-project

            echo "Unpacking files..."
            # 解压覆盖
            tar -xzvf release.tar.gz

            # 删除压缩包
            rm release.tar.gz

            echo "Restarting Docker containers..."
            # 重启服务
            docker compose down
            docker compose up -d --force-recreate

            # 清理无用镜像
            docker image prune -f

            echo "Deployment Success!"
