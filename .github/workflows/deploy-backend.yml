name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # 1. 编译 (依然在 GitHub 上做)
      - name: Build Binary
        run: |
          cd backend
          # 编译 Linux 二进制文件
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o main .
          
          # 【安全措施】在压缩前先给文件加一次执行权限
          chmod +x main
          
          # 打包以加速传输
          tar -czvf release.tar.gz main configs Dockerfile docker-compose.yml

      # 2. 配置 SSH (使用原生 ssh key)
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary # 忽略 host key 检查
          if_key_exists: replace

      # 3. 使用原生 SCP 和 SSH 上传并部署
      - name: Deploy with Retry
        run: |
          # 添加服务器到 known_hosts 以防询问
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

          echo "1. Uploading file (attempt 1)..."
          # 注意：这里的源文件路径是 backend/release.tar.gz
          if ! scp -o ConnectTimeout=30 backend/release.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/blue-lock-project/release.tar.gz; then
             echo "Upload failed, retrying in 10s..."
             sleep 10
             scp -o ConnectTimeout=60 backend/release.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/blue-lock-project/release.tar.gz
          fi

          echo "2. Executing remote commands..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd ~/blue-lock-project
            
            # 解压
            mkdir -p backend
            # 解压覆盖
            tar -xzvf release.tar.gz -C backend/
            rm release.tar.gz
            
            # 重启服务
            cd backend
            docker compose down
            
            # 【核心修改】必须加上 --build，强制使用新上传的 Dockerfile 和 main 文件重新构建镜像
            # 因为我们的 Dockerfile 只是 COPY 操作，这个构建过程只需 1 秒，非常快且不耗内存
            docker compose up -d --build --force-recreate
            
            # 清理无用的虚悬镜像
            docker image prune -f
            
            echo "✅ Deployment Successful!"
          EOF