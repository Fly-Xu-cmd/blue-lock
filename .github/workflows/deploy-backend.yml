name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 Go 环境 (使用 GitHub 的服务器)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # 2. 【关键】在 GitHub Runner 上编译二进制文件
      - name: Build Binary
        run: |
          cd backend
          # 静态编译，确保在 Alpine Linux 上能运行
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main .
          chmod +x main

      # 3. 将编译好的 main 文件连同配置一起传给服务器
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 关键修改：只上传 main 和 configs，排除 unnecessary 的源码和 logs
          source: "backend/main,backend/configs,backend/Dockerfile,backend/docker-compose.yml"
          target: "blue-lock-project"
          strip_components: 0
          timeout: "120s" # 增加超时时间，防止网络波动导致中断

      # 4. 远程命令：直接启动（无需 build）
      - name: Remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/blue-lock-project/backend

            echo "Reloading containers..."
            # 停止旧服务
            docker compose down

            # 启动服务 (注意：这里不需要 --build 了，因为是从本地 Dockerfile 启动)
            # 但为了确保使用新的 main 文件，我们强制重新创建容器
            docker compose up -d --force-recreate

            # 清理旧镜像
            docker image prune -f

            echo "Deployment finished!"
