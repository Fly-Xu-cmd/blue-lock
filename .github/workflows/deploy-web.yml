name: Deploy Web Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. 安装依赖 (使用我们之前讨论过的 legacy-peer-deps 解决版本冲突)
      - name: Install Dependencies
        run: |
          cd web
          npm install --legacy-peer-deps

      # 2. 编译构建 (Vite 默认输出到 dist 目录)
      - name: Build Project
        run: |
          cd web
          # 这一步会生成静态文件到 web/dist
          npm run build

      # 3. 上传到服务器的 /home/www/bluebox
      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 上传源：编译好的 build 文件夹内的所有内容
          source: "web/build/*"
          # 目标：服务器路径
          target: "/home/www/bluebox"
          # 移除本地路径前缀 (web/dist)，直接把内容放进目标目录
          strip_components: 2

      # 4. 可选：远程清理和权限修正 (防止上传后权限变了)
      - name: Fix Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 确保 Nginx 能读
            chmod -R 755 /home/www/bluebox
